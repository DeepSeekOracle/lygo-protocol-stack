# Publish docs/ (index.html + reference) to GitHub Pages
name: Deploy GitHub Pages

on:
  # Repo Pages source is the gh-pages branch (publish-gh-pages-branch.yml).
  # actions/deploy-pages fails when source is not "GitHub Actions" — do not run on push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If this job fails in ~1s, repo Pages source is probably "gh-pages branch" not Actions.
# Public site is still updated by publish-gh-pages-branch.yml — see docs/ENABLE_PAGES_NOW.md.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert docs site root
        run: test -f docs/index.html && test -f docs/SovereignLatticeMesh.html && test -f docs/BiometricEntropyHarness.html
      - name: Sync Compass Master into docs/tools (Pages path)
        run: |
          mkdir -p docs/tools
          if [ -f tools/LYGO_Compass_Master.html ]; then
            cp -f tools/LYGO_Compass_Master.html docs/tools/LYGO_Compass_Master.html
          fi
          if [ -f docs/LYGOSKILLHUB.html ]; then
            cp -f docs/LYGOSKILLHUB.html docs/lygoskillhub.html
          fi
      - name: Ensure Jekyll bypass for raw HTML
        run: touch docs/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4