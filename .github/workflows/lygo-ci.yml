name: LYGO Stack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  adversarial-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-docker.txt
          pip install -r requirements-phase9.txt

      - name: Generate falsifiable vectors (60+)
        run: python tools/generate_falsifiable_vectors.py

      - name: P0 pytest
        run: python -m pytest protocol0_byte_entropy_filter/tests/ -q

      - name: Grok audit harness (live P0–P5)
        run: python tools/run_grok_audit_demo.py

      - name: Twin gate calibration smoke
        run: python tools/run_twin_gate_calibration.py

      - name: Lattice alignment
        run: python tools/verify_lattice_alignment.py

      - name: Alignment badge (full)
        run: python tools/verify_alignment_badge.py --format=json

      - name: Haven Star Chart gate smoke
        run: |
          python tools/haven_star_chart_gate.py --example > /tmp/hsc_example.json
          python tools/haven_star_chart_gate.py /tmp/hsc_example.json

      - name: Haven Star Chart feed chain verify
        run: python tools/haven_star_chart_feed.py --verify