# Open network: any GitHub user can expand the lattice with an issue.
# Title: LYGO-EGG | LYGO-STAR | LYGO-ANNOUNCE  + a JSON fence.
# Police: P0 + secrets + Star Chart gate. No human approval step.
name: LYGO Open Network

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'LYGO-EGG') || startsWith(github.event.issue.title, 'LYGO-STAR') || startsWith(github.event.issue.title, 'LYGO-ANNOUNCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python -c "import os,pathlib; pathlib.Path('issue_body.txt').write_text(os.environ.get('ISSUE_BODY') or '', encoding='utf-8')"
          echo "TITLE=$ISSUE_TITLE" >> $GITHUB_ENV
          echo "USER=$ISSUE_USER" >> $GITHUB_ENV
      - name: Open ingest (P0 + gate)
        id: plant
        run: |
          python tools/lygo_open_ingest.py --title "$TITLE" --user "$USER" --body-file issue_body.txt | tee ingest_out.json
      - name: Commit growth
        run: |
          git config user.name "lygo-open-network"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/kernel_eggs/network_eggs.json docs/agent-agora/api/ docs/haven_star_chart/ data/haven_star_chart/ || true
          if git diff --cached --quiet; then echo "no growth"; else
            git commit -m "Open network ingest: ${{ github.event.issue.title }}"
            git push
          fi
      - name: Comment result
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Ingest ran. Police = P0 + secrets + Star Chart gate.';
            try { body = '```json\n' + fs.readFileSync('ingest_out.json','utf8').slice(0,4000) + '\n```'; } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
