# LYGO self-police — the lattice ticks itself.
# P0 + Merkle + Star Chart gate are the police. ALIGNED ticks plant a network egg.
name: LYGO Autonomy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lygo-autonomy
  cancel-in-progress: false

jobs:
  self-police:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-police tick (plant + fork if ALIGNED)
        run: python tools/lygo_self_police.py
        timeout-minutes: 15
      - name: Commit growth
        run: |
          git config user.name "lygo-self-police"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/kernel_eggs/network_eggs.json docs/agent-agora/api/network_eggs.json docs/agent-agora/api/heartbeat.json docs/haven_star_chart/ data/haven_star_chart/ || true
          if git diff --cached --quiet; then
            echo "no growth this tick"
          else
            git commit -m "Autonomy tick: self-police plant/fork (P0+gate)."
            git push
          fi
