<style id="lygo-feed-panel-css">
.lygo-feed-panel {

  box-sizing: border-box;
  border-radius: 14px;
  border: 1px solid rgba(212, 175, 55, 0.28);
  background: rgba(8, 10, 18, 0.92);
  color: #e9ecff;
  font-family: system-ui, Segoe UI, Inter, sans-serif;
}
.lygo-feed-panel h2 {

  color: #d4af37;
}
.lygo-feed-panel .feed-meta {

.lygo-feed-panel .feed-wrap {

  scrollbar-gutter: stable;

}
.lygo-feed-panel .feed-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
.lygo-feed-panel .feed-wrap::-webkit-scrollbar-thumb {

}
.lygo-feed-panel .feed-wrap::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.25); }
.lygo-feed-panel .feed-table {

}
.lygo-feed-panel .feed-table th {

  padding: 0.45rem 0.5rem;

}
.lygo-feed-panel .feed-table td {

  border-bottom: 1px solid rgba(255, 255, 255, 0.06);

}
.lygo-feed-panel .feed-badge {

  padding: 0.15rem 0.4rem;

}
.lygo-feed-panel .feed-accept { color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.45); }
.lygo-feed-panel .feed-reject { color: #e94560; border: 1px solid rgba(233, 69, 96, 0.45); }
.lygo-feed-panel .feed-pending { color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.4); }
.lygo-feed-panel .feed-muted { color: #9a9ab0; font-size: 0.65rem; }
.lygo-feed-panel .feed-hash { color: #00ff88; font-size: 0.65rem; }
.lygo-feed-panel .feed-err { color: #e94560; font-size: 0.62rem; margin-top: 0.2rem; }
.lygo-feed-panel .feed-empty { color: #9a9ab0; text-align: center; padding: 1rem; }
.lygo-feed-panel .feed-row-superseded { opacity: 0.55; }
.lygo-feed-panel .feed-badge.feed-superseded { opacity: 0.85; font-size: 0.58rem; }
@media (max-width: 640px) {
  .lygo-feed-panel { margin: 1rem 0.75rem 1.5rem; padding: 0.9rem; }
