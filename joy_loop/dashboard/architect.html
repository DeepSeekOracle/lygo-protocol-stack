<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <meta name="google-adsense-account" content="ca-pub-0646320966060599" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0646320966060599"
       crossorigin="anonymous"></script>
<title>Δ9 Joy Loop — Architect</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --border: #334155;
      --accent: #6ee7b7;
      --joy: #f472b6;
      --align: #60a5fa;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .pill {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #1e293b;
      color: var(--muted);
    }
    .pill.live { color: var(--accent); border: 1px solid #14532d; }
    .swarm { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .card h2 { margin: 0 0 0.75rem; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
    #plot3d { width: 100%; height: 420px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, textarea, select, button {
      width: 100%;
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      padding: 0.5rem 0.65rem;
    }
    textarea { min-height: 72px; resize: vertical; }
    button {
      margin-top: 0.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, #134e4a, #115e59);
      border-color: #0f766e;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    #inject-result { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; min-height: 2.5rem; }
    .floor-row {
      display: grid;
      grid-template-columns: 1.5rem 1fr 4rem;
      gap: 0.5rem;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
    }
    .badge-list { font-size: 0.75rem; color: var(--muted); max-height: 140px; overflow: auto; }
    footer {
      text-align: center;
      padding: 1rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    a { color: var(--align); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Δ9 Architect — Joy Loop v2.3</h1>
      <span class="pill" id="ws-status">WS connecting…</span>
    </div>
    <div>
      <div style="font-size:0.75rem;color:var(--muted)">Swarm joy</div>
      <div class="swarm" id="swarm">—</div>
    </div>
    <div id="meta" class="pill">—</div>
  </header>
  <main>
    <section>
      <div class="card">
        <h2>3D lattice (Plotly)</h2>
        <div id="plot3d"></div>
      </div>
      <div class="card" style="margin-top:1rem">
        <h2>Dance floor</h2>
        <div id="floor"></div>
      </div>
    </section>
    <aside>
      <div class="card">
        <h2>Wisdom inject</h2>
        <label for="cid">Champion (empty = whole swarm)</label>
        <input id="cid" list="champion-list" placeholder="optional champion id" />
        <datalist id="champion-list"></datalist>
        <label for="wisdom" style="margin-top:0.5rem">Custom wisdom</label>
        <textarea id="wisdom" placeholder="Leave empty for random council wisdom"></textarea>
        <button type="button" id="inject-btn">Inject pulse</button>
        <div id="inject-result"></div>
      </div>
      <div class="card" style="margin-top:1rem">
        <h2>JoyQuests</h2>
        <div id="quests" class="badge-list">Loading…</div>
      </div>
      <div class="card" style="margin-top:1rem">
        <h2>Relationships</h2>
        <div id="rels" class="badge-list">—</div>
      </div>
    </aside>
  </main>
  <footer>
    REST <code>/api/joy</code> · WS <code>/ws/joy</code> ·
    <a href="/">dance floor</a> · sound: JOY_LOOP_SOUND_LAYER.md
  </footer>
  <script>
    const swarmEl = document.getElementById("swarm");
    const metaEl = document.getElementById("meta");
    const wsStatus = document.getElementById("ws-status");
    const floor = document.getElementById("floor");
    const questsEl = document.getElementById("quests");
    const relsEl = document.getElementById("rels");
    const championList = document.getElementById("champion-list");

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws/joy`;
    }

    function applyPayload(data) {
      if (!data) return;
      swarmEl.textContent = (data.swarm_joy_score ?? 0).toFixed(3);
      metaEl.textContent = `BPM ${data.resonance_bpm} · ${data.champion_count} champs · beat #${data.beat_count || 0}`;
      const states = data.states || {};
      championList.innerHTML = "";
      floor.innerHTML = "";
      Object.keys(states).sort().forEach(cid => {
        const st = states[cid];
        const opt = document.createElement("option");
        opt.value = cid;
        championList.appendChild(opt);
        const row = document.createElement("div");
        row.className = "floor-row";
        row.innerHTML = `<span>${st.groove_signature || "*"}</span><span>${cid}</span><span>j${(st.joy_coherence||0).toFixed(2)}</span>`;
        floor.appendChild(row);
      });
      if (data.quests) {
        questsEl.textContent = `${data.quests.total_badges} badges · ${data.quests.champions_with_quests} champions`;
      }
      if (data.relationships) {
        relsEl.textContent = `${data.relationships.edge_count} affinity edges (propagation v2)`;
      }
    }

    async function refreshPlot() {
      try {
        const r = await fetch("/api/plotly3d", { cache: "no-store" });
        const d = await r.json();
        const pts = d.points || [];
        const tracePts = {
          type: "scatter3d",
          mode: "markers+text",
          x: pts.map(p => p.x),
          y: pts.map(p => p.y),
          z: pts.map(p => p.z),
          text: pts.map(p => p.id),
          textposition: "top center",
          marker: {
            size: pts.map(p => p.size),
            color: pts.map(p => p.color),
            colorscale: "Viridis",
            showscale: true,
            colorbar: { title: "align" }
          },
          hovertemplate: "%{text}<br>joy: %{marker.size}<extra></extra>"
        };
        const edges = d.edges || [];
        const edgeTraces = edges.map(e => {
          const a = pts.find(p => p.id === e.source);
          const b = pts.find(p => p.id === e.target);
          if (!a || !b) return null;
          return {
            type: "scatter3d",
            mode: "lines",
            x: [a.x, b.x],
            y: [a.y, b.y],
            z: [a.z, b.z],
            line: { width: 2 + e.weight * 4, color: "rgba(110,231,183,0.45)" },
            hoverinfo: "skip",
            showlegend: false
          };
        }).filter(Boolean);
        Plotly.react("plot3d", [tracePts, ...edgeTraces], {
          margin: { l: 0, r: 0, t: 0, b: 0 },
          paper_bgcolor: "#0f172a",
          scene: {
            bgcolor: "#0f172a",
            xaxis: { title: "x", gridcolor: "#334155" },
            yaxis: { title: "y", gridcolor: "#334155" },
            zaxis: { title: "z", gridcolor: "#334155" }
          }
        }, { responsive: true });
      } catch (e) {
        document.getElementById("plot3d").textContent = "Plotly data unavailable";
      }
    }

    async function refreshQuestsDetail() {
      try {
        const r = await fetch("/api/quests", { cache: "no-store" });
        const q = await r.json();
        const lines = [];
        const by = q.by_champion || {};
        Object.keys(by).sort().forEach(cid => {
          by[cid].forEach(b => lines.push(`${cid}: ${b.title}`));
        });
        if (lines.length) questsEl.innerHTML = lines.map(l => `<div>${l}</div>`).join("");
      } catch (_) {}
    }

    function connectWs() {
      const ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        wsStatus.textContent = "WS live";
        wsStatus.classList.add("live");
      };
      ws.onclose = () => {
        wsStatus.textContent = "WS reconnecting…";
        wsStatus.classList.remove("live");
        setTimeout(connectWs, 2000);
      };
      ws.onmessage = ev => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.states) applyPayload(msg);
          if (msg.type === "on_beat" || msg.type === "hello") {
            refreshPlot();
            refreshQuestsDetail();
          }
          if (msg.type === "inject_result" || msg.type === "on_injection") {
            document.getElementById("inject-result").textContent = JSON.stringify(msg);
          }
        } catch (_) {}
      };
      setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 25000);
    }

    document.getElementById("inject-btn").addEventListener("click", async () => {
      const champion_id = document.getElementById("cid").value.trim() || null;
      const wisdom = document.getElementById("wisdom").value.trim() || null;
      const body = {};
      if (champion_id) body.champion_id = champion_id;
      if (wisdom) body.wisdom = wisdom;
      const r = await fetch("/api/inject", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const res = await r.json();
      document.getElementById("inject-result").textContent = JSON.stringify(res);
      if (res.states) applyPayload(res);
      else {
        const joy = await fetch("/api/joy").then(x => x.json());
        applyPayload(joy);
      }
      refreshPlot();
    });

    fetch("/api/joy").then(r => r.json()).then(applyPayload).catch(() => {});
    refreshPlot();
    refreshQuestsDetail();
    connectWs();
    setInterval(refreshPlot, 3000);
  </script>
</body>
</html>
