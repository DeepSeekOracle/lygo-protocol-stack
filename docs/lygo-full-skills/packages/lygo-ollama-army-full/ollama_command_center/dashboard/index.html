<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LYGO Ollama Army — Command Dashboard</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --accent: #58a6ff; --ok: #3fb950; --bad: #f85149; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 2rem; }
    h1 { font-size: 1.4rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .card { background: var(--card); border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    pre { background: #010409; padding: 1rem; border-radius: 6px; overflow: auto; max-height: 320px; font-size: 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>🛡️ LYGO Ollama Army — Command Center</h1>
  <p>Δ9Φ963-ARMY-DASHBOARD · Read <code>workspace/sentinel_status.json</code> (open this file via local server or paste JSON below).</p>
  <div class="grid" id="cards"></div>
  <h2>Raw status</h2>
  <pre id="raw">Load ../workspace/sentinel_status.json — run: python scripts/sentinel_heartbeat.py</pre>
  <p><a href="https://github.com/DeepSeekOracle/lygo-protocol-stack/blob/main/docs/LYGO_LATTICE.md">LYGO Lattice</a> ·
     <a href="https://clawhub.ai/deepseekoracle/lygo-protocol-stack-operator">ClawHub operator</a></p>
  <script>
    async function load() {
      try {
        const r = await fetch('../workspace/sentinel_status.json?' + Date.now());
        const d = await r.json();
        document.getElementById('raw').textContent = JSON.stringify(d, null, 2);
        const cards = [
          ['Lattice', d.lattice?.summary, d.lattice?.ok],
          ['HF Space', d.hf_space?.stage || d.hf_space?.error, d.hf_space?.ok],
          ['Ollama', (d.ollama?.models || []).join(', ') || d.ollama?.error, d.ollama?.ok],
          ['Queue', `queued ${d.queue?.queued} · results ${d.queue?.results}`, true],
          ['Git', d.git?.status_line || d.git?.detail, d.git?.ok],
        ];
        document.getElementById('cards').innerHTML = cards.map(([t, v, ok]) =>
          `<div class="card"><strong>${t}</strong><div class="${ok ? 'ok' : 'bad'}">${v ?? '—'}</div></div>`
        ).join('');
      } catch (e) {
        document.getElementById('raw').textContent = 'Open via local server from ollama_command_center/dashboard/\\n' + e;
      }
    }
    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
