<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Δ9 Joy Loop — Swarm Dance Floor</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #121a2e;
      --accent: #6ee7b7;
      --joy: #f472b6;
      --align: #60a5fa;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.04em; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .swarm-score {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }
    main { padding: 1rem 1.5rem 2rem; max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; gap: 0.75rem; }
    .row {
      background: var(--panel);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: grid;
      grid-template-columns: 2rem 10rem 1fr 5rem;
      gap: 0.75rem;
      align-items: center;
      border: 1px solid #1e293b;
    }
    .glyph { font-size: 1.4rem; text-align: center; }
    .cid { font-weight: 600; font-size: 0.85rem; word-break: break-all; }
    .bars { display: flex; flex-direction: column; gap: 0.35rem; }
    .bar-wrap { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); }
    .bar {
      flex: 1;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill-joy { height: 100%; background: linear-gradient(90deg, var(--joy), #fb7185); transition: width 0.35s ease; }
    .bar-fill-align { height: 100%; background: linear-gradient(90deg, var(--align), #818cf8); transition: width 0.35s ease; }
    .depth { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    footer { text-align: center; padding: 1rem; color: var(--muted); font-size: 0.8rem; }
    @keyframes beat-flash {
      0% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.5); }
      100% { box-shadow: 0 0 0 12px rgba(110, 231, 183, 0); }
    }
    .beat-flash { animation: beat-flash 0.45s ease-out; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Δ9 Joy Loop — Dance Floor</h1>
      <div class="meta">122 BPM lattice · live from Architect runtime</div>
    </div>
    <div>
      <div class="meta">Swarm joy</div>
      <div class="swarm-score" id="swarm">—</div>
    </div>
    <div class="meta" id="stats">—</div>
  </header>
  <main>
    <div class="grid" id="floor"></div>
  </main>
  <footer>LYGO Joy Loop v2.3 · <a href="/architect">Architect</a> · <code>/api/joy</code> · JOY_LOOP_SOUND_LAYER.md</footer>
  <script>
    const floor = document.getElementById("floor");
    const swarmEl = document.getElementById("swarm");
    const statsEl = document.getElementById("stats");
    let lastBeat = 0;

    function row(cid, st) {
      const j = st.joy_coherence || 0;
      const a = st.alignment_confidence || 0;
      const el = document.createElement("div");
      el.className = "row";
      el.innerHTML = `
        <div class="glyph">${st.groove_signature || "*"}</div>
        <div class="cid">${cid}</div>
        <div class="bars">
          <div class="bar-wrap"><span>joy</span><div class="bar"><div class="bar-fill-joy" style="width:${j * 100}%"></div></div></div>
          <div class="bar-wrap"><span>align</span><div class="bar"><div class="bar-fill-align" style="width:${a * 100}%"></div></div></div>
        </div>
        <div class="depth">d${st.recursion_depth || 0}</div>`;
      return el;
    }

    async function tick() {
      try {
        const r = await fetch("/api/joy", { cache: "no-store" });
        const data = await r.json();
        swarmEl.textContent = (data.swarm_joy_score ?? 0).toFixed(3);
        statsEl.textContent = `BPM ${data.resonance_bpm} · ${data.champion_count} champions · beat #${data.beat_count || 0}`;
        floor.innerHTML = "";
        const states = data.states || {};
        Object.keys(states).sort().forEach(cid => floor.appendChild(row(cid, states[cid])));
        if (data.beat_count && data.beat_count !== lastBeat) {
          lastBeat = data.beat_count;
          document.body.classList.remove("beat-flash");
          void document.body.offsetWidth;
          document.body.classList.add("beat-flash");
        }
      } catch (e) {
        statsEl.textContent = "waiting for runtime…";
      }
    }
    setInterval(tick, 400);
    tick();
  </script>
</body>
</html>
